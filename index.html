<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSAG Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07060d; --panel:rgba(22,19,40,.62); --panel2:rgba(15,13,28,.9);
  --border:rgba(255,255,255,.08); --text:#eeedf7; --muted:#8e8aa8;
  --v:#8b5cf6; --c:#22d3ee; --p:#f472b6; --g:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
::selection{background:var(--v);color:#fff}

/* ---------- animated background ---------- */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(100px);animation:float 20s ease-in-out infinite}
.b1{width:560px;height:560px;background:var(--v);top:-180px;left:-140px;opacity:.45}
.b2{width:480px;height:480px;background:var(--c);top:28%;right:-180px;opacity:.28;animation-delay:-7s}
.b3{width:420px;height:420px;background:var(--p);bottom:-180px;left:30%;opacity:.28;animation-delay:-14s}
@keyframes float{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(70px,40px) scale(1.12)}66%{transform:translate(-50px,70px) scale(.92)}}
.grid-bg{position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);
  background-size:52px 52px;
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 72%);
          mask-image:radial-gradient(ellipse at 50% 0%,#000 25%,transparent 72%)}
.stars{position:absolute;inset:0}
.stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.5;animation:twinkle 4s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:.8}}

.wrap{max-width:1200px;margin:0 auto;padding:0 20px 90px}

/* ---------- header ---------- */
header{text-align:center;padding:70px 0 30px}
.logo{font-family:Orbitron,sans-serif;font-weight:900;font-size:clamp(56px,12vw,112px);letter-spacing:.08em;line-height:1;
  background:linear-gradient(120deg,var(--c),var(--v) 45%,var(--p),var(--c));background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 34px rgba(139,92,246,.5));animation:shift 8s linear infinite}
@keyframes shift{to{background-position:300% 0}}
.sub{margin-top:12px;color:var(--muted);letter-spacing:.5em;text-transform:uppercase;font-size:13px;padding-left:.5em}
.stats{display:flex;justify-content:center;gap:10px;margin-top:24px;flex-wrap:wrap}
.stat{padding:8px 16px;border:1px solid var(--border);border-radius:999px;background:var(--panel);backdrop-filter:blur(10px);font-size:14px;color:var(--muted)}
.stat b{color:var(--text);font-family:Orbitron,sans-serif;font-weight:600;margin-right:6px}

/* ---------- search ---------- */
.search{position:relative;max-width:740px;margin:14px auto 0;z-index:30}
.search-box{position:relative;display:flex;align-items:center;gap:14px;padding:0 18px 0 22px;height:66px;border-radius:20px;
  background:var(--panel2);border:1px solid var(--border);backdrop-filter:blur(16px);transition:box-shadow .3s}
.search-box::before{content:'';position:absolute;inset:-1px;border-radius:21px;padding:1.5px;
  background:linear-gradient(120deg,var(--c),var(--v),var(--p));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
  opacity:0;transition:opacity .3s;pointer-events:none}
.search-box:focus-within::before{opacity:1}
.search-box:focus-within{box-shadow:0 0 50px rgba(139,92,246,.35)}
.search-box svg{flex:none;color:var(--muted)}
.search-box input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:500 18px 'Space Grotesk',sans-serif}
.search-box input::placeholder{color:#5f5b78}
.kbd{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:2px 8px}
.clear{display:none;width:30px;height:30px;border-radius:8px;color:var(--muted);font-size:20px;line-height:1}
.clear:hover{background:rgba(255,255,255,.07);color:var(--text)}
.search.has-text .clear{display:block}
.search.has-text .kbd{display:none}

.dropdown{position:absolute;top:calc(100% + 10px);left:0;right:0;background:rgba(14,12,26,.97);border:1px solid var(--border);border-radius:18px;
  backdrop-filter:blur(18px);overflow:hidden auto;max-height:380px;box-shadow:0 24px 70px rgba(0,0,0,.6);
  opacity:0;transform:translateY(-6px);pointer-events:none;transition:opacity .18s,transform .18s}
.dropdown.open{opacity:1;transform:none;pointer-events:auto}
.dd-head{padding:10px 18px 6px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.opt{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 18px;cursor:pointer;border-left:3px solid transparent}
.opt.active{background:linear-gradient(90deg,rgba(139,92,246,.28),transparent);border-left-color:var(--c)}
.opt .nm{font-weight:500}
.opt mark{background:none;color:var(--c);font-weight:700}
.opt .meta{color:var(--muted);font-size:13px;white-space:nowrap}
.opt .meta b{color:var(--g);font-weight:600}
.dd-empty{padding:18px;color:var(--muted);text-align:center}

/* ---------- controls ---------- */
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:30px}
.chips{display:flex;flex-wrap:wrap;gap:8px;flex:1}
.chip{padding:7px 14px;border-radius:999px;border:1px solid var(--border);background:var(--panel);font-size:14px;color:var(--muted);transition:all .2s;backdrop-filter:blur(8px)}
.chip span{opacity:.55;margin-left:6px;font-size:12px}
.chip:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
.chip.on{color:#fff;border-color:transparent;background:linear-gradient(120deg,var(--v),var(--p));box-shadow:0 0 22px rgba(139,92,246,.45)}
.chip.reset{border-style:dashed}
.sort{position:relative}
.sort select{appearance:none;background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:12px;padding:9px 36px 9px 14px;font:500 14px 'Space Grotesk',sans-serif;cursor:pointer;outline:0}
.sort select option{background:#141226}
.sort::after{content:'▾';position:absolute;right:13px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}

/* ---------- sector ---------- */
.sector{position:relative;margin-top:28px;padding:30px;border-radius:24px;border:1px solid rgba(139,92,246,.3);overflow:hidden;
  background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(34,211,238,.07) 60%,rgba(244,114,182,.12));animation:up .45s both}
.sector::before{content:'';position:absolute;width:300px;height:300px;right:-80px;top:-120px;border-radius:50%;background:var(--c);filter:blur(90px);opacity:.25}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;padding:6px 12px;margin-left:-12px;border-radius:10px;transition:.2s}
.back:hover{color:var(--text);background:rgba(255,255,255,.06)}
.sector h2{position:relative;font-family:Orbitron,sans-serif;font-weight:800;font-size:clamp(28px,5vw,46px);margin-top:10px;line-height:1.15;
  background:linear-gradient(120deg,#fff,#c9b8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.sector .stags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.sgrid{position:relative;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:22px}
.sbox{padding:14px 16px;border-radius:14px;background:rgba(7,6,13,.45);border:1px solid var(--border)}
.sbox small{display:block;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.sbox strong{display:block;margin-top:6px;font-family:Orbitron,sans-serif;font-size:22px}
.sbox.low strong{color:#4ade80}

/* ---------- results ---------- */
.results-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:28px;color:var(--muted);font-size:14px}
.results-head b{color:var(--text)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:18px;margin-top:16px}
.card{position:relative;display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:20px;background:var(--panel);border:1px solid var(--border);
  backdrop-filter:blur(12px);overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s;
  animation:up .5s both;animation-delay:calc(min(var(--i),16) * 35ms)}
.card::before{content:'';position:absolute;inset:0;background:radial-gradient(400px circle at var(--mx,50%) var(--my,0%),rgba(139,92,246,.18),transparent 45%);opacity:0;transition:opacity .3s;pointer-events:none}
.card:hover{transform:translateY(-5px);border-color:rgba(139,92,246,.55);box-shadow:0 14px 44px rgba(139,92,246,.25)}
.card:hover::before{opacity:1}
.card.best{border-color:rgba(74,222,128,.45)}
.badge{position:absolute;top:14px;right:14px;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:rgba(74,222,128,.15);color:#4ade80}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.card h3{font-size:19px;font-weight:700;line-height:1.25;padding-right:70px;cursor:pointer;transition:color .2s}
.card h3:hover{color:var(--c)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(34,211,238,.1);color:#8be9f7;border:1px solid rgba(34,211,238,.18);cursor:pointer;transition:.2s}
.tag:hover{background:rgba(34,211,238,.22)}
.price{display:flex;align-items:center;gap:10px;font-family:Orbitron,sans-serif;font-weight:800;font-size:28px;color:var(--g);text-shadow:0 0 22px rgba(251,191,36,.35);margin-top:auto}
.price svg{filter:drop-shadow(0 0 8px rgba(34,211,238,.6))}
.dc{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:11px 14px;border-radius:12px;
  background:rgba(88,101,242,.16);border:1px solid rgba(88,101,242,.35);transition:.2s;text-align:left}
.dc:hover{background:rgba(88,101,242,.32);box-shadow:0 0 24px rgba(88,101,242,.35)}
.dc .who{display:flex;align-items:center;gap:9px;font-weight:500;overflow:hidden}
.dc .who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dc small{color:#aab1ff;font-size:12px;white-space:nowrap}

.unit{color:var(--c);text-shadow:0 0 18px rgba(34,211,238,.5);margin-left:1px}
.more-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:30px}
.more-wrap small{color:var(--muted);font-size:13px}
.more{padding:13px 30px;border-radius:14px;font-weight:700;letter-spacing:.05em;color:#fff;
  background:linear-gradient(120deg,var(--v),var(--p));box-shadow:0 0 28px rgba(139,92,246,.4);transition:transform .2s,box-shadow .2s}
.more:hover{transform:translateY(-2px);box-shadow:0 0 42px rgba(139,92,246,.6)}
.empty{grid-column:1/-1;text-align:center;padding:70px 20px;color:var(--muted)}
.empty .big{font-size:48px;margin-bottom:10px}

.demo{max-width:740px;margin:18px auto 0;padding:10px 16px;border-radius:12px;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.3);color:#fcd34d;font-size:13px;text-align:center}

.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,30px);opacity:0;padding:12px 20px;border-radius:14px;
  background:linear-gradient(120deg,var(--v),var(--p));color:#fff;font-weight:600;box-shadow:0 10px 40px rgba(139,92,246,.5);transition:.3s;z-index:50;pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}

footer{text-align:center;color:#55516d;font-size:13px;padding:40px 0 30px}

@media (max-width:600px){
  header{padding:48px 0 20px}
  .search-box{height:58px}
  .search-box input{font-size:16px}
  .kbd{display:none}
  .sector{padding:22px}
  .controls{flex-direction:column;align-items:stretch}
  .sort select{width:100%}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="bg">
  <div class="grid-bg"></div>
  <div class="stars" id="stars"></div>
  <div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
</div>

<div class="wrap">
  <header>
    <div class="logo">PSAG</div>
    <div class="sub">Marketplace</div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="search" id="search">
    <div class="search-box">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="text" placeholder="Search items… e.g. dark matter pickaxe" autocomplete="off" spellcheck="false">
      <button class="clear" id="clear" aria-label="Clear">×</button>
      <span class="kbd">/</span>
    </div>
    <div class="dropdown" id="dd"></div>
  </div>
  <div id="demoNote"></div>

  <div class="controls">
    <div class="chips" id="chips"></div>
    <div class="sort">
      <select id="sort">
        <option value="price-asc">Price: low → high</option>
        <option value="price-desc">Price: high → low</option>
        <option value="name">Name A → Z</option>
        <option value="newest">Newest listed</option>
      </select>
    </div>
  </div>

  <div id="sectorWrap"></div>
  <div class="results-head" id="rhead"></div>
  <div class="cards" id="cards"></div>
  <div id="more"></div>

  <footer>PSAG Market · contact sellers on Discord · trade safe</footer>
</div>

<div class="toast" id="toast"></div>

<script>
/* Demo data — only used if listings.json can't be loaded (e.g. opening the file directly from your PC) */
const DEMO = [
  { name:"Dark Matter Pickaxe", tags:["tool","pickaxe","dark matter"], price:"2.5B", discord:"notnickatall" },
  { name:"Dark Matter Pickaxe", tags:["tool","pickaxe","dark matter"], price:"2.2B", discord:"gemlord" },
  { name:"Dark Matter Pickaxe", tags:["tool","pickaxe","dark matter"], price:"2.9B", discord:"psag_trader" },
  { name:"Rainbow Pickaxe", tags:["tool","pickaxe","rainbow"], price:"450M", discord:"gemlord" },
  { name:"Huge Hell Rock", tags:["pet","huge"], price:"8B", discord:"notnickatall" },
  { name:"Titanic Balloon Dragon", tags:["pet","titanic"], price:"95B", discord:"whale_mode" },
  { name:"Secret Key", tags:["item","key"], price:"35M", discord:"minerboi" }
];

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm = s => String(s ?? '').toLowerCase().trim().replace(/\s+/g,' ');

function parsePrice(p){
  if (typeof p === 'number') return p;
  const s = String(p ?? '').toLowerCase().replace(/[, ]/g,'');
  const m = s.match(/(\d*\.?\d+)([kmbt])?/);
  if (!m) return NaN;
  return parseFloat(m[1]) * ({k:1e3, m:1e6, b:1e9, t:1e12}[m[2]] || 1);
}
function fmtPrice(n, raw){
  if (!isFinite(n)) return esc(raw ?? '—');
  for (const [v,s] of [[1e12,'T'],[1e9,'B'],[1e6,'M'],[1e3,'K']]) if (n >= v) return +(n/v).toFixed(2) + `<span class="unit">${s}</span>`;
  return String(+n.toFixed(2));
}
function lev(a,b){
  const d = Array.from({length:a.length+1}, (_,i)=>[i]);
  for (let j=1;j<=b.length;j++) d[0][j]=j;
  for (let i=1;i<=a.length;i++) for (let j=1;j<=b.length;j++)
  {
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
    if (i>1 && j>1 && a[i-1]===b[j-2] && a[i-2]===b[j-1]) d[i][j] = Math.min(d[i][j], d[i-2][j-2]+1); // swapped letters
  }
  return d[a.length][b.length];
}
/* how well query q matches item name n (both normalized). -1 = no match */
function score(q, n){
  if (!q) return 1;
  if (n === q) return 1000;
  if (n.startsWith(q)) return 900 - n.length;
  const words = n.split(' ');
  if (words.some(w => w.startsWith(q))) return 800 - n.length;
  const i = n.indexOf(q);
  if (i >= 0) return 700 - i;
  // every typed word appears somewhere ("pick dark")
  const qw = q.split(' ');
  if (qw.length > 1 && qw.every(w => n.includes(w))) return 650;
  // typo tolerance
  if (q.length >= 3){
    // every typed word must roughly match the start of some word in the name
    let total = 0, ok = true;
    for (const w of qw){
      const dw = Math.min(...words.map(x => Math.min(lev(w, x.slice(0, w.length)), lev(w, x.slice(0, w.length + 1)))));
      if (dw > (w.length < 4 ? 0 : Math.max(1, Math.floor(w.length / 4)))) { ok = false; break; }
      total += dw;
    }
    if (ok) return 400 - total * 50;
    const whole = lev(q, n.slice(0, q.length));
    if (whole <= Math.max(1, Math.floor(q.length / 4))) return 380 - whole * 50;
  }
  return -1;
}

const GEM = `<svg width="24" height="24" viewBox="0 0 24 24"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><path d="M6 3h12l4 6-10 12L2 9z" fill="url(#gg)"/><path d="M2 9h20M8 3l4 18 4-18M6 3l2 6m8-6-2 6" stroke="#0b0a18" stroke-opacity=".35" fill="none"/></svg>`;
const CHAT = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.4A8 8 0 1 1 21 12z"/></svg>`;

/* ---------- state ---------- */
let listings = [];
const state = { query:'', tags:new Set(), sort:'price-asc', item:null, active:-1, sugg:[], shown:0, list:[] };
const PAGE = 100;

/* ---------- load ---------- */
async function load(){
  let data, demo = false;
  try {
    const r = await fetch('listings.json', {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    data = await r.json();
  } catch (e) { data = DEMO; demo = true; }
  if (!Array.isArray(data)) data = data.listings || [];

  listings = data.filter(x => x && x.name).map((x, i) => ({
    id: i,
    name: String(x.name).trim(),
    key: norm(x.name),
    tags: (Array.isArray(x.tags) ? x.tags : String(x.tags || '').split(',')).map(t => String(t).trim()).filter(Boolean),
    priceRaw: x.price,
    price: parsePrice(x.price),
    discord: String(x.discord || '').trim()
  }));

  if (demo) $('#demoNote').innerHTML = `<div class="demo">⚠ Couldn't load <b>listings.json</b>, showing demo data. It works once it's on GitHub Pages (or a local server).</div>`;
  readHash();
  renderAll();
}

/* ---------- data views ---------- */
const hasTag = (l, t) => l.tags.some(x => norm(x) === t);
const passTags = l => [...state.tags].every(t => hasTag(l, t));

function groupItems(arr){
  const m = new Map();
  for (const l of arr){
    let g = m.get(l.key);
    if (!g){ g = { key:l.key, name:l.name, count:0, min:Infinity, max:-Infinity, tags:new Map(), sellers:new Set() }; m.set(l.key, g); }
    g.count++;
    if (isFinite(l.price)){ g.min = Math.min(g.min, l.price); g.max = Math.max(g.max, l.price); }
    l.tags.forEach(t => g.tags.set(norm(t), t));
    if (l.discord) g.sellers.add(l.discord.toLowerCase());
  }
  return m;
}

function suggestions(q){
  const items = groupItems(listings.filter(passTags));
  return [...items.values()]
    .map(g => ({ ...g, s: score(q, g.key) }))
    .filter(g => g.s >= 0)
    .sort((a,b) => b.s - a.s || b.count - a.count || a.name.localeCompare(b.name));
}

function visibleListings(){
  let arr = listings.filter(passTags);
  if (state.item) arr = arr.filter(l => l.key === state.item);
  else if (state.query){
    const q = norm(state.query);
    const ok = new Set(suggestions(q).map(g => g.key));
    arr = arr.filter(l => ok.has(l.key));
  }
  const byPrice = (a,b,dir) => {
    const A = isFinite(a.price) ? a.price : null, B = isFinite(b.price) ? b.price : null;
    if (A === null && B === null) return 0;
    if (A === null) return 1;
    if (B === null) return -1;
    return dir * (A - B);
  };
  const sorters = {
    'price-asc': (a,b) => byPrice(a,b,1),
    'price-desc': (a,b) => byPrice(a,b,-1),
    'name': (a,b) => a.name.localeCompare(b.name) || byPrice(a,b,1),
    'newest': (a,b) => b.id - a.id
  };
  return arr.sort(sorters[state.sort]);
}

/* ---------- render ---------- */
function renderStats(){
  const items = groupItems(listings);
  const sellers = new Set(listings.map(l => l.discord.toLowerCase()).filter(Boolean));
  $('#stats').innerHTML =
    `<div class="stat"><b>${listings.length}</b>listings</div>
     <div class="stat"><b>${items.size}</b>items</div>
     <div class="stat"><b>${sellers.size}</b>sellers</div>`;
}

function renderChips(){
  const counts = new Map();
  const base = state.item ? listings.filter(l => l.key === state.item) : listings;
  for (const l of base) for (const t of l.tags){
    const k = norm(t);
    const c = counts.get(k) || { label:t, n:0 };
    c.n++; counts.set(k, c);
  }
  state.tags.forEach(t => { if (!counts.has(t)) counts.set(t, { label:t, n:0 }); });
  const list = [...counts.entries()].sort((a,b) => b[1].n - a[1].n || a[0].localeCompare(b[0]));
  $('#chips').innerHTML =
    list.map(([k,v]) => `<button class="chip ${state.tags.has(k)?'on':''}" data-tag="${esc(k)}">#${esc(v.label)}<span>${v.n}</span></button>`).join('') +
    (state.tags.size ? `<button class="chip reset" data-reset>✕ clear filters</button>` : '');
}

function renderSector(){
  const w = $('#sectorWrap');
  if (!state.item){ w.innerHTML = ''; return; }
  const g = groupItems(listings.filter(l => l.key === state.item)).get(state.item);
  if (!g){ w.innerHTML = ''; return; }
  const prices = listings.filter(l => l.key === state.item && isFinite(l.price)).map(l => l.price);
  const avg = prices.length ? prices.reduce((a,b)=>a+b,0) / prices.length : NaN;
  w.innerHTML = `
    <section class="sector">
      <button class="back" id="back">← All items</button>
      <h2>${esc(g.name)}</h2>
      <div class="stags">${[...g.tags.values()].map(t => `<span class="tag" data-tag="${esc(norm(t))}">#${esc(t)}</span>`).join('')}</div>
      <div class="sgrid">
        <div class="sbox"><small>Listings</small><strong>${g.count}</strong></div>
        <div class="sbox low"><small>Lowest</small><strong>${fmtPrice(g.min)}</strong></div>
        <div class="sbox"><small>Average</small><strong>${fmtPrice(avg)}</strong></div>
        <div class="sbox"><small>Highest</small><strong>${fmtPrice(g.max)}</strong></div>
      </div>
    </section>`;
}

function cardHTML(l, i, cheapest, counts){
  const best = cheapest.get(l.key) === l && counts.get(l.key).count > 1;
  return `
    <article class="card ${best?'best':''}" style="--i:${i}">
      ${best ? '<div class="badge">Best price</div>' : ''}
      <h3 data-item="${esc(l.key)}">${esc(l.name)}</h3>
      <div class="tags">${l.tags.map(t => `<span class="tag" data-tag="${esc(norm(t))}">#${esc(t)}</span>`).join('')}</div>
      <div class="price">${GEM}<span>${fmtPrice(l.price, l.priceRaw)}</span></div>
      ${l.discord ? `<button class="dc" data-copy="${esc(l.discord)}"><span class="who">${CHAT}<span>${esc(l.discord)}</span></span><small>Copy</small></button>` : ''}
    </article>`;
}

function renderMore(){
  const left = state.list.length - state.shown;
  $('#more').innerHTML = left > 0
    ? `<div class="more-wrap"><button class="more" id="loadMore">Load ${Math.min(PAGE, left)} more</button><small>Showing ${state.shown} of ${state.list.length}</small></div>`
    : '';
}

function renderCards(){
  const arr = state.list = visibleListings();
  const what = state.item ? 'offers' : 'listings';
  $('#rhead').innerHTML = `<div><b>${arr.length}</b> ${what}${state.query && !state.item ? ` matching “${esc(state.query)}”` : ''}</div>`;

  if (!arr.length){
    state.shown = 0;
    $('#cards').innerHTML = `<div class="empty"><div class="big">🔍</div>Nothing found. Try another name or remove some filters.</div>`;
    renderMore();
    return;
  }
  // cheapest per item gets a badge
  state.cheapest = new Map();
  for (const l of arr) if (isFinite(l.price) && (!state.cheapest.has(l.key) || l.price < state.cheapest.get(l.key).price)) state.cheapest.set(l.key, l);
  state.counts = groupItems(arr);

  state.shown = Math.min(PAGE, arr.length);
  $('#cards').innerHTML = arr.slice(0, state.shown).map((l, i) => cardHTML(l, i, state.cheapest, state.counts)).join('');
  renderMore();
}

function loadMore(){
  const from = state.shown, to = Math.min(from + PAGE, state.list.length);
  $('#cards').insertAdjacentHTML('beforeend',
    state.list.slice(from, to).map((l, i) => cardHTML(l, i, state.cheapest, state.counts)).join(''));
  state.shown = to;
  renderMore();
}

function renderAll(){
  renderStats(); renderChips(); renderSector(); renderCards();
}

/* ---------- autocomplete ---------- */
function highlight(name, q){
  const i = norm(name).indexOf(q);
  if (!q || i < 0) return esc(name);
  return esc(name.slice(0,i)) + '<mark>' + esc(name.slice(i, i+q.length)) + '</mark>' + esc(name.slice(i+q.length));
}
function openDropdown(){
  const q = norm(state.query);
  const dd = $('#dd');
  state.sugg = suggestions(q).slice(0, 10);
  state.active = state.sugg.length ? 0 : -1;
  if (!state.sugg.length){
    dd.innerHTML = q ? `<div class="dd-empty">No items match “${esc(state.query)}”</div>` : '';
  } else {
    dd.innerHTML = `<div class="dd-head">${q ? 'Items' : 'All items'}</div>` + state.sugg.map((g, i) => `
      <div class="opt ${i===state.active?'active':''}" data-i="${i}">
        <span class="nm">${highlight(g.name, q)}</span>
        <span class="meta">${g.count} listing${g.count>1?'s':''}${isFinite(g.min) ? ` · from <b>${fmtPrice(g.min)}</b>` : ''}</span>
      </div>`).join('');
  }
  dd.classList.toggle('open', !!dd.innerHTML);
}
function closeDropdown(){ $('#dd').classList.remove('open'); state.active = -1; }
function setActive(i){
  const opts = [...document.querySelectorAll('.opt')];
  if (!opts.length) return;
  state.active = (i + opts.length) % opts.length;
  opts.forEach((o, k) => o.classList.toggle('active', k === state.active));
  opts[state.active].scrollIntoView({block:'nearest'});
}

function selectItem(key){
  const l = listings.find(x => x.key === key);
  if (!l) return;
  state.item = key;
  state.query = l.name;
  $('#q').value = l.name;
  $('#search').classList.add('has-text');
  closeDropdown();
  history.replaceState(null, '', '#item=' + encodeURIComponent(key));
  renderAll();
  window.scrollTo({ top: $('.controls').offsetTop - 20, behavior:'smooth' });
}
function clearItem(){
  state.item = null;
  history.replaceState(null, '', location.pathname + location.search);
}
function readHash(){
  const m = location.hash.match(/^#item=(.+)$/);
  const key = m ? decodeURIComponent(m[1]) : null;
  if (key && listings.some(l => l.key === key)){
    state.item = key;
    const l = listings.find(x => x.key === key);
    state.query = l.name; $('#q').value = l.name; $('#search').classList.add('has-text');
  } else state.item = null;
}

/* ---------- events ---------- */
const q = $('#q');
q.addEventListener('input', () => {
  state.query = q.value;
  $('#search').classList.toggle('has-text', !!q.value);
  if (state.item) clearItem();
  openDropdown();
  renderAll();
});
q.addEventListener('focus', openDropdown);
q.addEventListener('keydown', e => {
  const open = $('#dd').classList.contains('open');
  if (e.key === 'ArrowDown'){ e.preventDefault(); open ? setActive(state.active + 1) : openDropdown(); }
  else if (e.key === 'ArrowUp'){ e.preventDefault(); setActive(state.active - 1); }
  else if (e.key === 'Enter'){
    e.preventDefault();
    const g = state.sugg[state.active] || state.sugg[0];
    if (open && g) selectItem(g.key); else closeDropdown();
  }
  else if (e.key === 'Escape'){ closeDropdown(); q.blur(); }
});
$('#dd').addEventListener('mousedown', e => {
  const o = e.target.closest('.opt');
  if (o){ e.preventDefault(); selectItem(state.sugg[+o.dataset.i].key); }
});
$('#dd').addEventListener('mousemove', e => {
  const o = e.target.closest('.opt');
  if (o && +o.dataset.i !== state.active) setActive(+o.dataset.i);
});
document.addEventListener('click', e => { if (!e.target.closest('#search')) closeDropdown(); });
$('#clear').addEventListener('click', () => {
  q.value = ''; state.query = ''; clearItem();
  $('#search').classList.remove('has-text');
  renderAll(); q.focus();
});
document.addEventListener('keydown', e => {
  if (e.key === '/' && document.activeElement !== q){ e.preventDefault(); q.focus(); q.select(); }
});
$('#sort').addEventListener('change', e => { state.sort = e.target.value; renderCards(); });

document.addEventListener('click', e => {
  const t = e.target.closest('[data-tag]');
  if (t && !t.closest('#dd')){
    const k = t.dataset.tag;
    state.tags.has(k) ? state.tags.delete(k) : state.tags.add(k);
    renderAll(); return;
  }
  if (e.target.closest('[data-reset]')){ state.tags.clear(); renderAll(); return; }
  if (e.target.closest('#back')){
    clearItem(); state.query=''; q.value=''; $('#search').classList.remove('has-text');
    renderAll(); return;
  }
  const it = e.target.closest('[data-item]');
  if (it){ selectItem(it.dataset.item); return; }
  if (e.target.closest('#loadMore')){ loadMore(); return; }
  const c = e.target.closest('[data-copy]');
  if (c) copy(c.dataset.copy);
});
window.addEventListener('hashchange', () => { readHash(); renderAll(); });

/* card spotlight follows mouse */
document.addEventListener('mousemove', e => {
  const c = e.target.closest('.card');
  if (!c) return;
  const r = c.getBoundingClientRect();
  c.style.setProperty('--mx', (e.clientX - r.left) + 'px');
  c.style.setProperty('--my', (e.clientY - r.top) + 'px');
});

/* copy discord name */
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}
async function copy(txt){
  try { await navigator.clipboard.writeText(txt); }
  catch {
    const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove();
  }
  toast(`Copied “${txt}”, DM them on Discord`);
}

/* stars */
(() => {
  const s = $('#stars'); let h = '';
  for (let i=0;i<60;i++) h += `<i style="left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${-Math.random()*4}s;opacity:${Math.random()*.6}"></i>`;
  s.innerHTML = h;
})();

load();
</script>
</body>
